<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sesiones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sesiones">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c2410c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1d2321; --muted:#5e6964; --line:#d9ddd8;
  --accent:#c2410c; --accent-soft:#fbe5d8; --ok:#2f7a4a; --ok-soft:#dcefe2;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --paper:#1d2320; --ink:#e7ebe8; --muted:#9aa59f; --line:#323a36;
  --accent:#f08a4b; --accent-soft:#3a2418; --ok:#6cc58c; --ok-soft:#1b3324; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.link{border:none;background:none;color:var(--accent);padding:6px 0;min-height:0;font-weight:700}
button.small{min-height:36px;padding:6px 10px;font-size:.88rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=url],input[type=date],input[type=number],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:88px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sess{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.sess .n{font-family:var(--f-display);font-weight:600;font-size:1.08rem;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--accent-soft);color:var(--accent)}
.pill.sx{background:var(--ink);color:var(--paper)}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.concept{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:2.2rem 1fr 5.5rem;gap:8px;align-items:center}
.cnum{font-family:var(--f-mono);font-size:.95rem;color:var(--accent);text-align:center}
.crow input[type=number]{text-align:right;font-family:var(--f-mono)}
.mins{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.prop,.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prop:last-child,.chk:last-child{border-bottom:none}
.prop input[type=checkbox],.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.prop input[type=text]{border:none;padding:6px 0;min-height:36px;background:transparent}
.prop .st{font-size:.75rem;font-weight:700;flex:none}
.chk span{flex:1;min-width:0}
.chk.done span{color:var(--muted);text-decoration:line-through}
.group{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-top:10px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.slug{font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.sw{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)} .dot.off{background:var(--accent)}
.blk{font-family:var(--f-display);font-size:1.25rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase;border-top:3px solid var(--accent);padding-top:8px;margin-top:6px}
.chk .nm{flex:1;min-width:0}
.chk input[type=text]{border:none;padding:6px 0;min-height:36px;background:transparent}
.cnt{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);flex:none}
.tog{border:none;background:none;padding:6px 8px;min-height:36px;font-family:var(--f-mono);font-size:.82rem;color:var(--accent);font-weight:700}
.plano{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid var(--line)}
.plano .p1{display:flex;align-items:center;gap:8px}
.plano .p1 textarea{flex:1;min-width:0;resize:none;overflow:hidden;border:none;padding:6px 0;min-height:36px;background:transparent;line-height:1.35;white-space:pre-wrap;word-break:break-word;font:inherit;color:inherit}
.cact{border:none;border-left:3px solid var(--accent-soft);border-radius:0;padding:4px 8px;min-height:34px;background:transparent;font-size:.92rem}
.pend{font-size:.7rem;color:var(--accent);font-weight:700;padding-left:11px}
.mdl{position:fixed;inset:0;z-index:50;background:#111;color:#fff;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
.mdl button{background:#262626;border-color:#444;color:#fff}
.mdl .bar2{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mdl .es{font-size:.95rem;color:#b9b9b9;margin:10px 0 0;overflow-wrap:anywhere}
.mdl .big{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,4.2rem);line-height:1.15;overflow-wrap:anywhere;padding:12px 0}
.mdl .big.sin{font-size:1.2rem;font-weight:400;color:#999}
.mdl .small2{font-size:.78rem;color:#aaa;text-align:center;min-height:1.2em}
.mdl .nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.mdl .nav button{flex:1;min-height:56px;font-size:1.1rem}
.mdl .nav .spk{flex:none;width:72px;font-size:1.5rem}
.mdl .lang button.on{background:var(--accent);border-color:var(--accent)}
.plano input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.plano.done textarea{color:var(--muted);text-decoration:line-through}
.crow2{display:grid;grid-template-columns:2.2rem 1fr 5.5rem;gap:8px;align-items:center}
.crow2 input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);justify-self:center}
.concept.done .crow2 .ctit{color:var(--muted)}
.ctit{resize:none;overflow:hidden;min-height:44px;line-height:1.3;white-space:pre-wrap;word-break:break-word}
.cact.cact{resize:none;overflow:hidden;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.dest{display:flex;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div id="msg" class="notice" hidden></div>

  <div id="vList">
    <div class="top">
      <div><div class="eyebrow">Stock · guiones de rodaje</div><h1>Sesiones</h1></div>
      <button class="primary" id="btnNew">+ Nueva sesión</button>
    </div>
    <div class="row" style="margin:14px 0 4px;justify-content:space-between">
      <label class="sw"><input type="checkbox" id="showArch"> Ver archivadas</label>
      <button class="link" id="btnCfg"><span class="dot" id="dot"></span><span id="stSync">Sin conectar</span></button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div id="vCfg" hidden>
    <div class="wrap" style="gap:18px">
      <button class="link" id="cfgBack" style="align-self:flex-start">‹ Volver</button>
      <h1>Sincronización</h1>
      <p style="margin:0;color:var(--muted)">Las sesiones se guardan en tu hoja de Google “Cuaderno de Sesiones”. Pega aquí la dirección de su aplicación web (termina en <code>/exec</code>). Se pone una vez en cada aparato (ordenador y móvil). No se envía a ningún otro sitio.</p>
      <label class="f">Dirección de la hoja (URL /exec)<input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="row"><button class="primary" id="cfgSave">Guardar y sincronizar</button><span class="status" id="cfgSt"></span></div>
    </div>
  </div>

  <div id="vDetail" hidden></div>
</div>
<div id="vModelo" class="mdl" hidden></div>

<script>
/* Casillas fijas de cada bloque (clave, texto corto). Las claves viejas se conservan en los datos. */
const BLOQUES = [
  ["Antes de salir de casa", [
    ["vestuario","Vestuario preparado"],
    ["bat","Baterías"],
    ["tarj","Tarjetas"],
    ["ajustes","Ajustes cámara"],
    ["cinta","Cinta negra"],
    ["tripode","Trípode y filtros"],
    ["agua","Agua y comida"],
    ["pago","Pago modelos"]]],
  ["Al empezar la sesión", [
    ["revVest","Vestuario revisado"],
    ["revProps","Props revisados"]]],
  ["Durante la sesión", []]   // 2026-11-09: sin casillas fijas (fotógrafo); solo los conceptos y sus planos
];
const PARTE_TXT="Parte Stocksy hecha: 2 de 3 distintos (vestuario, modelos, localización)";
const parteOn=s=>!!(s.destino&&s.destino.micros&&s.destino.stocksy);

/* ---------- almacenamiento: copia local + hoja de Google ---------- */
const LS_DATA="cuaderno.sesiones", LS_URL="cuaderno.url", LS_PEND="cuaderno.pendientes";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);

/* Pasa una sesión guardada con el formato antiguo al nuevo, sin perder nada. */
function normalize(s){
  if(!s||typeof s!=="object")return s;
  if(!Array.isArray(s.modelos)){
    const txt=String(s.modelos||"").trim();
    if(txt){
      s.modelos_antiguo=txt; // copia del texto original
      s.modelos=txt.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(n=>({id:uid(),nombre:n,confirmado:false,release:false}));
    } else s.modelos=[];
  }
  s.modelos=s.modelos.map(m=>typeof m==="string"?{id:uid(),nombre:m,confirmado:false,release:false}:m);
  if(!s.destino||typeof s.destino!=="object")s.destino={micros:!s.stocksy,stocksy:!!s.stocksy};
  s.stocksy=!!s.destino.stocksy; // la hoja de Google sigue leyendo este campo
  s.conceptos=(s.conceptos||[]).map(c=>{if(!Array.isArray(c.planos))c.planos=[];if(c.hecho==null)c.hecho=false;return c});
  s.props=s.props||[]; s.checklist=s.checklist||{};
  return s;
}
let store=ls.get(LS_DATA,{});          // id -> sesión
Object.values(store).forEach(normalize);
let pending=new Set(ls.get(LS_PEND,[])); // ids con cambios sin subir
let syncing=false, again=false, online=null;
const apiUrl=()=>ls.get(LS_URL,"");
function persist(){ls.set(LS_DATA,store);ls.set(LS_PEND,[...pending])}
const $=s=>document.querySelector(s);

function setSync(state,text){online=state;$("#dot").className="dot "+(state===true?"on":state===false?"off":"");$("#stSync").textContent=text}

async function sync(){
  const url=apiUrl();
  if(!url){setSync(null,"Configurar sincronización");return}
  if(syncing){again=true;return} syncing=true; again=false;
  try{
    if(pending.size){
      const sesiones=[...pending].map(id=>store[id]).filter(Boolean);
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({sesiones})});
      const j=await r.json(); if(!j.ok)throw new Error(j.error||"error");
      sesiones.forEach(s=>{if(store[s.id]?.actualizada===s.actualizada)pending.delete(s.id)});
    }
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now());
    const j=await r.json(); if(!j.ok)throw new Error(j.error||"error");
    let changed=false;
    for(const s of j.sesiones){
      const mine=store[s.id];
      if(pending.has(s.id))continue;
      if(!mine||(s.actualizada||"")>(mine.actualizada||"")){store[s.id]=normalize(s);changed=true}
    }
    persist();
    setSync(true, pending.size?"Cambios pendientes":"Sincronizado "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}));
    if(changed)onRemoteChange();
  }catch(e){ setSync(false,"Sin conexión · guardado en este aparato"); }
  finally{ syncing=false; if(again)setTimeout(sync,100); }
}

/* ---------- interfaz ---------- */
let cur=null, saveTimer=null;
const abiertos=new Set(); // conceptos con los planos desplegados (solo vista)
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>(s.fecha||"AAAA-MM-DD")+"_"+(s.nombre||"Nombre");
const mins=s=>(s.conceptos||[]).reduce((a,c)=>a+(+c.minutos||0),0);
function showMsg(t){const m=$("#msg");m.textContent=t;m.hidden=!t}
function show(v){["#vList","#vCfg","#vDetail"].forEach(id=>$(id).hidden=id!==v);window.scrollTo(0,0)}

/* Casillas de cada bloque de una sesión: [hechas, total] */
function progreso(s){
  const ck=s.checklist||{}, mo=s.modelos||[], cs=s.conceptos||[], props=s.props||[];
  const cnt=(arr)=>[arr.filter(Boolean).length,arr.length];
  const fijas=i=>BLOQUES[i][1].map(([k])=>!!ck[k]);
  const antes=[...fijas(0),...props.map(p=>!!p.tengo),...mo.map(m=>!!m.confirmado)];
  const empezar=fijas(1);
  const durante=[...cs.map(c=>!!c.hecho),...cs.flatMap(c=>(c.planos||[]).map(p=>!!p.hecho))];
  if(parteOn(s))durante.push(!!ck.parteStocksy);
  return [cnt(antes),cnt(empezar),cnt(durante)];
}

function renderList(){
  const arch=$("#showArch").checked;
  const rows=Object.values(store).filter(s=>!!s.archivada===arch).sort((a,b)=>(a.fecha||"9999").localeCompare(b.fecha||"9999"));
  const el=$("#list");
  if(!rows.length){el.innerHTML=`<div class="empty card">${arch?"No hay sesiones archivadas.":"Aún no hay sesiones. Pulsa <b>+ Nueva sesión</b>."}</div>`;return}
  el.innerHTML=rows.map(s=>{
    const props=s.props||[],have=props.filter(p=>p.tengo).length;
    const pr=progreso(s), done=pr.reduce((a,x)=>a+x[0],0), tot=pr.reduce((a,x)=>a+x[1],0);
    const d=s.destino||{};
    return `<button class="card sess" data-id="${esc(s.id)}">
      <span class="n">${esc(slug(s))}</span>
      <span class="meta">${d.micros?'<span class="pill">Micros</span>':''}${d.stocksy?'<span class="pill sx">Stocksy</span>':''}
        <span>${esc(s.lugar||"Sin localización")}</span>
        <span class="mins">${(s.conceptos||[]).length} conceptos · ${mins(s)} min</span></span>
      <span class="meta">
        <span class="pill ${props.length&&have===props.length?'ok':'no'}">Props ${have}/${props.length}</span>
        <span class="pill ${tot&&done===tot?'ok':''}">Hecho ${done}/${tot}</span></span>
    </button>`}).join("");
}

function onRemoteChange(){
  if(!cur){renderList();return}
  const remote=store[cur.id];
  if(remote&&remote.actualizada!==cur.actualizada&&!document.activeElement?.matches("input,textarea")){cur=JSON.parse(JSON.stringify(remote));renderDetail()}
}

function openSession(id){cur=normalize(JSON.parse(JSON.stringify(store[id])));renderDetail();show("#vDetail")}
function closeSession(){commit();cur=null;renderList();show("#vList")}

const bloqueHead=(i,pr)=>`<h2 class="blk">${BLOQUES[i][0]} <span class="cnt">${pr[i][0]}/${pr[i][1]}</span></h2>`;
const fijasHtml=(s,i)=>BLOQUES[i][1].map(([k,t])=>chkHtml(`data-chk="${k}"`,!!(s.checklist||{})[k],esc(t))).join("");
const chkHtml=(attr,on,inner)=>`<label class="chk ${on?'done':''}"><input type="checkbox" ${attr} ${on?"checked":""}><span>${inner}</span></label>`;

function renderDetail(){
  const s=cur, d=$("#vDetail");
  const props=s.props||[], have=props.filter(p=>p.tengo).length;
  const pr=progreso(s), dest=s.destino||{};
  const modelos=s.modelos||[], conceptos=s.conceptos||[];
  d.innerHTML=`
  <div class="wrap" style="gap:22px">
    <div class="top"><button class="link" id="back">‹ Sesiones</button><span class="status" id="stDet">Guardado</span></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">Sesión</div>
      <h1 style="overflow-wrap:anywhere">${esc(s.nombre||"Sesión nueva")}</h1>
      <div class="slug"><span id="slugTxt">${esc(slug(s))}</span><button class="small" id="copy">Copiar</button></div>
    </div>
    <section class="card">
      <div class="sechead"><h2>Datos</h2></div>
      <div class="grid2">
        <label class="f">Nombre (sin fecha)<input type="text" data-k="nombre" value="${esc(s.nombre)}" placeholder="PeopleInCity FamilyVlog"></label>
        <label class="f">Fecha<input type="date" data-k="fecha" value="${esc(s.fecha)}"></label>
        <label class="f">Localización<input type="text" data-k="lugar" value="${esc(s.lugar)}"></label>
        <label class="f">Vestuario<input type="text" data-k="vestuario" value="${esc(s.vestuario)}"></label>
      </div>
      <div class="dest"><label class="sw"><input type="checkbox" id="f_micros" ${dest.micros?"checked":""}> Micros</label>
        <label class="sw"><input type="checkbox" id="f_stocksy" ${dest.stocksy?"checked":""}> Stocksy</label></div>
    </section>
    <section class="card">
      <div class="sechead"><h2>Guion general</h2></div>
      <textarea data-k="guion" rows="4" placeholder="Guion">${esc(s.guion)}</textarea>
    </section>

    ${bloqueHead(0,pr)}
    <section class="card">
      <div class="sechead"><h2>Modelos</h2></div>
      <div>${modelos.map(m=>`
        <div class="chk ${m.confirmado?'done':''}" data-mid="${esc(m.id)}">
          <input type="checkbox" data-mf="confirmado" ${m.confirmado?"checked":""} aria-label="Confirmado">
          <input type="text" data-mf="nombre" value="${esc(m.nombre)}" placeholder="Modelo">
          <span class="cnt" style="flex:none">confirmado</span>
          <button class="small" data-act="delm" aria-label="Quitar modelo">✕</button>
        </div>`).join("")||'<div class="empty">Sin modelos.</div>'}</div>
      <button id="addM">+ Añadir modelo</button>
    </section>
    <section class="card">
      <div class="sechead"><h2>Props</h2><span class="pill ${props.length&&have===props.length?'ok':'no'}">Tengo ${have}/${props.length}</span></div>
      <div>${props.map(p=>`
        <div class="prop" data-pid="${esc(p.id)}">
          <input type="checkbox" ${p.tengo?"checked":""} aria-label="Lo tengo">
          <input type="text" value="${esc(p.nombre)}" placeholder="Prop">
          <span class="st" style="color:var(${p.tengo?'--ok':'--accent'})">${p.tengo?"Lo tengo":"Falta"}</span>
          <button class="small" data-act="delp" aria-label="Quitar prop">✕</button>
        </div>`).join("")||'<div class="empty">Sin props.</div>'}</div>
      <button id="addP">+ Añadir prop</button>
    </section>
    <section class="card"><div>${fijasHtml(s,0)}</div></section>

    ${bloqueHead(1,pr)}
    <section class="card"><div>${fijasHtml(s,1)}</div></section>

    ${bloqueHead(2,pr)}
    <section class="card">
      <div class="sechead"><h2>Conceptos</h2><span class="mins">Total ${mins(s)} min</span></div>
      <div style="display:flex;flex-direction:column;gap:18px">
      ${conceptos.map((c,i)=>{
        const pl=c.planos||[], ph=pl.filter(p=>p.hecho).length, open=abiertos.has(c.id);
        return `
        <div class="concept ${c.hecho?'done':''}" data-cid="${esc(c.id)}">
          <div class="crow2"><input type="checkbox" data-ck="hecho" ${c.hecho?"checked":""} aria-label="Hecho">
            <textarea class="ctit" data-ck="titulo" rows="1" placeholder="Concepto" aria-label="Título del concepto">${esc(c.titulo)}</textarea>
            <input type="number" data-ck="minutos" value="${esc(c.minutos)}" min="0" inputmode="numeric" aria-label="Minutos"></div>
          <div class="row"><span class="cnum">${String(i+1).padStart(2,"0")}</span>
            <button class="tog" data-act="tog">${open?"▾":"▸"} planos ${ph}/${pl.length}</button>
            <button class="small" data-act="show">Mostrar al modelo</button><button class="small" data-act="up">↑</button><button class="small" data-act="down">↓</button><button class="small" data-act="del">Quitar</button></div>
          ${open?`<div>
            <textarea data-ck="guion" rows="3" placeholder="Mini guion">${esc(c.guion)}</textarea>
            <textarea class="cact" data-ck="acting" rows="1" placeholder="Acting general (modelo)" aria-label="Acting general">${esc(c.acting)}</textarea>
            <div class="pend" data-pend="c" ${c.acting_pendiente?"":"hidden"}>traducción pendiente</div>
            ${pl.map(p=>`<div class="plano ${p.hecho?'done':''}" data-plid="${esc(p.id)}">
              <div class="p1"><input type="checkbox" data-pf="hecho" ${p.hecho?"checked":""} aria-label="Plano hecho">
              <textarea data-pf="texto" rows="1" placeholder="Plano">${esc(p.texto)}</textarea>
              <button class="small" data-act="pup" aria-label="Subir">↑</button><button class="small" data-act="pdown" aria-label="Bajar">↓</button><button class="small" data-act="pdel" aria-label="Quitar plano">✕</button></div>
            </div>`).join("")}
            <button class="small" data-act="padd" style="margin-top:8px">+ Añadir plano</button></div>`:""}
        </div>`}).join("")||'<div class="empty">Sin conceptos.</div>'}
      </div>
      <button id="addC">+ Añadir concepto</button>
    </section>
    <div class="row"><button id="arch">${s.archivada?"Recuperar de archivadas":"Archivar sesión"}</button></div>
  </div>`;
  bindDetail();
  autoAlto();
}
/* planos: el textarea crece con el texto para que se lea entero (fotógrafo, 2026-11-09: con una línea solo se leían 5 palabras) */
function autoAlto(){document.querySelectorAll(".plano textarea,.ctit,.cact").forEach(t=>{t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"})}
document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches(".plano textarea,.ctit,.cact")){e.target.style.height="auto";e.target.style.height=(e.target.scrollHeight+2)+"px"}});
window.addEventListener("resize",autoAlto);

function bindDetail(){
  const d=$("#vDetail");
  $("#back").onclick=closeSession;
  $("#copy").onclick=()=>{const t=slug(cur);try{navigator.clipboard.writeText(t).then(()=>{$("#copy").textContent="Copiado"},selectSlug)}catch(e){selectSlug()}};
  d.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{cur[el.dataset.k]=el.value;$("#slugTxt").textContent=slug(cur);touch()}));
  const setDest=()=>{cur.destino={micros:$("#f_micros").checked,stocksy:$("#f_stocksy").checked};cur.stocksy=cur.destino.stocksy;touch(true);renderDetail()};
  $("#f_micros").onchange=setDest; $("#f_stocksy").onchange=setDest;

  /* modelos */
  d.querySelectorAll("[data-mid]").forEach(row=>{
    const m=cur.modelos.find(x=>x.id===row.dataset.mid);
    row.querySelector("[data-mf=confirmado]").onchange=e=>{m.confirmado=e.target.checked;touch(true);renderDetail()};
    row.querySelector("[data-mf=nombre]").addEventListener("input",e=>{m.nombre=e.target.value;touch()});
    row.querySelector("[data-act=delm]").onclick=()=>{cur.modelos.splice(cur.modelos.indexOf(m),1);touch(true);renderDetail()};
  });
  $("#addM").onclick=()=>{(cur.modelos||=[]).push({id:uid(),nombre:"",confirmado:false,release:false});touch(true);renderDetail();[...document.querySelectorAll("[data-mf=nombre]")].pop()?.focus()};
  d.querySelectorAll("[data-mrel]").forEach(el=>el.onchange=()=>{cur.modelos.find(x=>x.id===el.dataset.mrel).release=el.checked;touch(true);renderDetail()});

  /* conceptos y planos */
  d.querySelectorAll(".concept").forEach(box=>{
    const c=cur.conceptos.find(x=>x.id===box.dataset.cid);
    box.querySelectorAll("[data-ck]").forEach(el=>{
      if(el.dataset.ck==="hecho")el.onchange=()=>{c.hecho=el.checked;touch(true);renderDetail()};
      else el.addEventListener("input",()=>{c[el.dataset.ck]=el.dataset.ck==="minutos"?(+el.value||0):el.value;
        if(el.dataset.ck==="acting"){c.acting_pendiente=true;const pd=box.querySelector("[data-pend=c]");if(pd)pd.hidden=false}
        touch()});
    });
    box.querySelectorAll(".plano").forEach(row=>{
      const p=c.planos.find(x=>x.id===row.dataset.plid);
      row.querySelector("[data-pf=hecho]").onchange=e=>{p.hecho=e.target.checked;touch(true);renderDetail()};
      row.querySelector("[data-pf=texto]").addEventListener("input",e=>{p.texto=e.target.value;touch()});
    });
    box.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const a=cur.conceptos,i=a.indexOf(c), act=b.dataset.act;
      if(act==="tog"){abiertos.has(c.id)?abiertos.delete(c.id):abiertos.add(c.id);renderDetail();return}
      if(act==="show"){commit();abrirModelo(c);return}
      if(act==="padd"){c.planos.push({id:uid(),texto:"",acting:"",hecho:false});touch(true);renderDetail();[...box.querySelectorAll("[data-pf=texto]")].pop()?.focus();return}
      if(act.startsWith("p")){
        const row=b.closest(".plano"), pa=c.planos, p=pa.find(x=>x.id===row.dataset.plid), pi=pa.indexOf(p);
        if(act==="pdel")pa.splice(pi,1);
        if(act==="pup"&&pi>0)[pa[pi-1],pa[pi]]=[pa[pi],pa[pi-1]];
        if(act==="pdown"&&pi<pa.length-1)[pa[pi+1],pa[pi]]=[pa[pi],pa[pi+1]];
        touch(true);renderDetail();return}
      if(act==="del")a.splice(i,1);
      if(act==="up"&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];
      if(act==="down"&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];
      touch(true);renderDetail()});
  });
  $("#addC").onclick=()=>{const id=uid();(cur.conceptos||=[]).push({id,titulo:"",minutos:5,guion:"",hecho:false,planos:[]});abiertos.add(id);touch(true);renderDetail();[...document.querySelectorAll(".concept [data-ck=titulo]")].pop()?.focus()};

  /* props */
  d.querySelectorAll(".prop").forEach(row=>{
    const p=cur.props.find(x=>x.id===row.dataset.pid);
    row.querySelector("input[type=checkbox]").onchange=e=>{p.tengo=e.target.checked;touch(true);renderDetail()};
    row.querySelector("input[type=text]").addEventListener("input",e=>{p.nombre=e.target.value;touch()});
    row.querySelector("[data-act=delp]").onclick=()=>{cur.props.splice(cur.props.indexOf(p),1);touch(true);renderDetail()};
  });
  $("#addP").onclick=()=>{(cur.props||=[]).push({id:uid(),nombre:"",tengo:false});touch(true);renderDetail();[...document.querySelectorAll(".prop input[type=text]")].pop()?.focus()};
  d.querySelectorAll("[data-chk]").forEach(el=>el.onchange=()=>{(cur.checklist||={})[el.dataset.chk]=el.checked;touch(true);renderDetail()});
  $("#arch").onclick=()=>{cur.archivada=!cur.archivada;touch(true);closeSession()};
}
/* ---------- Mostrar al modelo ---------- */
const LS_LANG="cuaderno.idioma";
let mdl={slides:[],i:0,lang:ls.get(LS_LANG,"en")==="th"?"th":"en",c:null};
function abrirModelo(c){
  const slides=[]; let start=0, found=false;
  (cur.conceptos||[]).forEach(k=>{
    if(k===c)found=true;
    if((k.acting||"").trim()||k.acting_en||k.acting_th){slides.push({es:k.acting||"",en:k.acting_en||"",th:k.acting_th||"",pend:!!k.acting_pendiente,self:k===c});}
  });
  start=Math.max(0,slides.findIndex(x=>x.self)); if(start<0)start=0;
  if(!slides.some(x=>x.self)){const idx=cur.conceptos.indexOf(c);start=0;let n=0;cur.conceptos.forEach((k,j)=>{if((k.acting||"").trim()||k.acting_en||k.acting_th){if(j<idx)n++}});start=Math.min(n,Math.max(0,slides.length-1))}
  mdl={slides,i:start,lang:mdl.lang,c};
  $("#vModelo").hidden=false; document.body.style.overflow="hidden";
  drawModelo();
}
function cerrarModelo(){try{speechSynthesis.cancel()}catch(e){} $("#vModelo").hidden=true; document.body.style.overflow=""}
function vozPara(lang){
  try{const vs=speechSynthesis.getVoices()||[];const pre=lang.slice(0,2).toLowerCase();
    return vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().replace("_","-").startsWith(pre))||null}catch(e){return null}
}
function drawModelo(){
  const m=mdl, n=m.slides.length, v=$("#vModelo"), sl=m.slides[m.i]||null;
  const big=sl?(m.lang==="th"?sl.th:sl.en):"";
  v.innerHTML=`<div class="bar2"><div class="lang row"><button data-l="en" class="${m.lang==="en"?"on":""}">EN</button><button data-l="th" class="${m.lang==="th"?"on":""}">TH</button></div>
    <span class="status">${n?(m.i+1)+" / "+n:""}</span><button data-x="close">Cerrar</button></div>
    <p class="es">${sl?esc(sl.es):""}</p>
    <div class="big ${big?"":"sin"}">${!n?"Ningún concepto tiene acting.":big?esc(big):"Sin traducción a "+(m.lang==="th"?"tailandés":"inglés")}</div>
    <div class="small2" id="mdlNote">${sl&&sl.pend?"traducción pendiente":""}</div>
    <div class="nav"><button data-x="prev" ${m.i<=0?"disabled":""} aria-label="Anterior">‹</button>
      <button class="spk" data-x="spk" aria-label="Leer en voz alta" ${big?"":"disabled"}>🔊</button>
      <button data-x="next" ${m.i>=n-1?"disabled":""} aria-label="Siguiente">›</button></div>`;
  v.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{mdl.lang=b.dataset.l;ls.set(LS_LANG,mdl.lang);try{speechSynthesis.cancel()}catch(e){}drawModelo()});
  v.querySelector("[data-x=close]").onclick=cerrarModelo;
  v.querySelector("[data-x=prev]").onclick=()=>irModelo(-1);
  v.querySelector("[data-x=next]").onclick=()=>irModelo(1);
  v.querySelector("[data-x=spk]").onclick=()=>hablar(big);
}
function irModelo(d){const j=mdl.i+d;if(j<0||j>=mdl.slides.length)return;try{speechSynthesis.cancel()}catch(e){}mdl.i=j;drawModelo()}
function hablar(txt){
  const note=$("#mdlNote"); if(!txt)return;
  if(!("speechSynthesis" in window)){note.textContent="Este aparato no tiene voz.";return}
  const lang=mdl.lang==="th"?"th-TH":"en-US", voz=vozPara(lang);
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt); u.lang=lang; if(voz)u.voice=voz;
    note.textContent=voz?"":"No hay voz de "+(mdl.lang==="th"?"tailandés":"inglés")+" en este aparato.";
    speechSynthesis.speak(u);
  }catch(e){note.textContent="No se pudo leer en voz alta."}
}
(function(){
  const v=$("#vModelo"); let x0=null,y0=0;
  v.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  v.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)irModelo(dx<0?1:-1)},{passive:true});
  document.addEventListener("keydown",e=>{if(v.hidden)return;if(e.key==="Escape")cerrarModelo();if(e.key==="ArrowRight")irModelo(1);if(e.key==="ArrowLeft")irModelo(-1)});
  try{speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices()}catch(e){}
})();
function selectSlug(){const r=document.createRange();r.selectNodeContents($("#slugTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)}

function touch(now){const st=$("#stDet");if(st)st.textContent="Guardando…";clearTimeout(saveTimer);saveTimer=setTimeout(commit,now?50:700)}
function commit(){
  clearTimeout(saveTimer); if(!cur)return;
  const prev=store[cur.id]; if(prev&&JSON.stringify({...prev,actualizada:0})===JSON.stringify({...cur,actualizada:0}))return;
  cur.actualizada=new Date().toISOString();
  store[cur.id]=JSON.parse(JSON.stringify(cur)); pending.add(cur.id); persist();
  const st=$("#stDet"); if(st)st.textContent=apiUrl()?"Guardado":"Guardado en este aparato";
  sync();
}

$("#btnNew").onclick=()=>{
  cur={id:uid()+uid(),nombre:"",fecha:"",lugar:"",modelos:[],vestuario:"",guion:"",stocksy:false,destino:{micros:true,stocksy:false},conceptos:[],props:[],checklist:{},creada:new Date().toISOString(),actualizada:""};
  commit(); renderDetail(); show("#vDetail"); document.querySelector("[data-k=nombre]").focus();
};
$("#showArch").onchange=renderList;
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openSession(b.dataset.id)});
$("#btnCfg").onclick=()=>{$("#cfgUrl").value=apiUrl();$("#cfgSt").textContent="";show("#vCfg")};
$("#cfgBack").onclick=()=>{renderList();show("#vList")};
$("#cfgSave").onclick=async()=>{
  const u=$("#cfgUrl").value.trim();
  if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)){$("#cfgSt").textContent="Esa dirección no parece la de la hoja (debe acabar en /exec).";return}
  ls.set(LS_URL,u); Object.keys(store).forEach(id=>pending.add(id)); persist();
  $("#cfgSt").textContent="Sincronizando…"; await sync();
  $("#cfgSt").textContent=online?"Listo: sincronizado.":"No se pudo conectar. Revisa la dirección.";
};

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync();else commit()});
window.addEventListener("pagehide",commit);
window.addEventListener("online",sync);
setInterval(()=>{if(document.visibilityState==="visible")sync()},30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
renderList(); sync();
</script>
